trigger:
- main

pr:
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest

variables:
  fileName: 'test.txt'

stages:
- stage: CreateContent
  displayName: 'Create Content' 
  jobs:
  - job: CreateTextFile
    displayName: 'Create Text File'
    steps:
    - script: |
        echo Hello World! > $(fileName)
      displayName: 'Create a text file with text'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.SourcesDirectory)'
        artifact: 'file'

- stage: ShowContent
  displayName: 'Show Content'
  jobs:
  - job: OpenTextFile
    displayName: 'OpenTextFile'
    steps:
    - task: DownloadPipelineArtifact@2
      inputs:
        artifact: file
        path: $(Build.SourcesDirectory)
    - script: |
        cat '$(Build.SourcesDirectory)/$(fileName)'
      displayName: 'Show text file content'
