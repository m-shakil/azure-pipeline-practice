trigger:
- main

pr:
  branches:
    include:
    - main

pool:
  vmImage: ubuntu-latest

stages:
- stage: CreateContent
  displayName: 'Create Content' 
  jobs:
  - job: CreateTextFile
    displayName: 'Create Text File'
    steps:
    - script: |
        echo Hello World! > test.txt
        pwd
        ls -la
      displayName: 'Create a text file with text'
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Pipeline.Workspace)'
        artifact: 'Store text file'

    

- stage: ShowContent
  displayName: 'Show Content'
  jobs:
  - job: OpenTextFile
    displayName: 'OpenTextFile'
    steps:
    - script: |
        pwd
        ls -la
        cat '$(Pipeline.Workspace)/test.txt'
      displayName: 'Show text file content'
